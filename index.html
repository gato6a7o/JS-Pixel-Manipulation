<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Particles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="canvas1" role="img"></canvas>
    <aside class="settings-panel">
        <details open>
            <summary>
                <h1 class="panel-title">Ajuste de las particulas</h1>
                <span class="disclosure-icon" aria-hidden="true"></span>
            </summary>
            <div class="panel-content">

                <fieldset class="mode-options">
                    <div class="mode-list">
                        <label class="mode-option" for="mode-personalizado">
                            <input id="mode-personalizado" type="radio" name="particle-mode" value="personalizado" checked>
                            <span>Personalizado</span>
                        </label>
                        <label class="mode-option" for="mode-explosivo">
                            <input id="mode-explosivo" type="radio" name="particle-mode" value="explosivo">
                            <span>Explosivo</span>
                        </label>
                        <label class="mode-option" for="mode-elastico">
                            <input id="mode-elastico" type="radio" name="particle-mode" value="elastico">
                            <span>Elastico</span>
                        </label>
                        <label class="mode-option" for="mode-magnetico">
                            <input id="mode-magnetico" type="radio" name="particle-mode" value="magnetico">
                            <span>Magnetico</span>
                        </label>
                        <label class="mode-option" for="mode-repulsion">
                            <input id="mode-repulsion" type="radio" name="particle-mode" value="repulsion">
                            <span>Repulsion</span>
                        </label>
                        <label class="mode-option" for="mode-vortice">
                            <input id="mode-vortice" type="radio" name="particle-mode" value="vortice">
                            <span>Vortice</span>
                        </label>
                        <label class="mode-option" for="mode-liquido">
                            <input id="mode-liquido" type="radio" name="particle-mode" value="liquido">
                            <span>Liquido</span>
                        </label>
                        <label class="mode-option" for="mode-caotico">
                            <input id="mode-caotico" type="radio" name="particle-mode" value="caotico">
                            <span>Caotico</span>
                        </label>
                        <label class="mode-option" for="mode-gravedad">
                            <input id="mode-gravedad" type="radio" name="particle-mode" value="gravedad">
                            <span>Gravedad</span>
                        </label>
                    </div>
                </fieldset>

                <section class="custom-settings">
                    <section class="setting">
                        <div class="setting-heading">
                            <h2>Empuje</h2>
                            <output id="push-value" class="setting-value" for="push-strength">0,9</output>
                        </div>
                        <p id="push-description" class="setting-description">Intensidad de la dispersion</p>
                        <div class="control-preview" style="--fill: 30%;">
                            <span></span>
                            <input id="push-strength" class="setting-slider" type="range" min="0" max="3" step="0.1" value="0.9">
                        </div>
                    </section>

                    <section class="setting">
                        <div class="setting-heading">
                            <h2>Radio del raton</h2>
                            <output id="radius-value" class="setting-value" for="interaction-radius">80 px</output>
                        </div>
                        <p id="radius-description" class="setting-description">Zona de reaccion alrededor del cursor</p>
                        <div class="control-preview" style="--fill: 24.1379%;">
                            <span></span>
                            <input id="interaction-radius" class="setting-slider" type="range" min="10" max="300" step="1" value="80">
                        </div>
                    </section>

                    <section class="setting">
                        <div class="setting-heading">
                            <h2>Regreso</h2>
                            <output id="return-value" class="setting-value" for="return-speed">0,1</output>
                        </div>
                        <p id="return-description" class="setting-description">Velocidad para volver a la posicion inicial</p>
                        <div class="control-preview" style="--fill: 33.3333%;">
                            <span></span>
                            <input id="return-speed" class="setting-slider" type="range" min="0" max="0.3" step="0.01" value="0.1">
                        </div>
                    </section>
                </section>
            </div>
        </details>
    </aside>
    <script src="script.js"></script>
</body>
</html>
